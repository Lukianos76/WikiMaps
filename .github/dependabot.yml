version: 2
updates:
  # Dépendances npm
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Regroupe minor + patch en une seule PR pour réduire le bruit ;
      # les majors restent en PR individuelles (à reviewer attentivement).
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Actions GitHub (évite que les actions deviennent obsolètes comme vu en Phase 0)
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Image de base Docker (node:24-alpine, nginx:alpine)
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
