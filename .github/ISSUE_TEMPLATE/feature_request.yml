name: ✨ Feature request
description: Suggest an improvement or a new feature
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / need
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
