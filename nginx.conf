# Detect the browser's preferred language (Accept-Language).
# Replaces the Next middleware (unavailable in static export).
# Any preference starting with "fr" → fr, otherwise → en.
map $http_accept_language $wm_lang {
    default        en;
    "~*^\s*fr"     fr;
    "~*,\s*fr"     fr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: behind a Docker port mapping (3000->80) or a reverse
    # proxy, the internal port/scheme (80/http) must not leak into the Location
    # header. This keeps the browser on http://localhost:3000.
    absolute_redirect off;

    # Compression (large GeoJSON files coming later)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/geo+json
        image/svg+xml;

    # Redirect the root to the detected locale
    location = / {
        return 302 /$wm_lang/;
    }

    # GeoJSON data (mounted as a volume, served without a rebuild)
    location /data/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # Static export: pages generated at /en/index.html, /fr/index.html, etc.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
