# Détection de la langue préférée du navigateur (Accept-Language).
# Remplace le middleware Next (indisponible en export statique).
# Toute préférence commençant par « fr » → fr, sinon → en.
map $http_accept_language $wm_lang {
    default        en;
    "~*^\s*fr"     fr;
    "~*,\s*fr"     fr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression (GeoJSON volumineux à venir)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/geo+json
        image/svg+xml;

    # Redirection de la racine vers la locale détectée
    location = / {
        return 302 /$wm_lang/;
    }

    # Données GeoJSON (montées en volume, servies sans rebuild)
    location /data/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # Export statique : pages générées en /fr/index.html, /en/index.html, etc.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
